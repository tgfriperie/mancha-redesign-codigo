<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categoria · Loja Mancha Alvi Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  /* topo da categoria: foto real da torcida + degradê verde pro texto ler */
  .cat-hero{position:relative;overflow:hidden;background:var(--verde-escuro) var(--foto-cat,none) center/cover no-repeat;color:#fff;min-height:220px;display:flex;align-items:flex-end;padding:40px 0 22px}
  .cat-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,32,20,.2) 0%,rgba(0,32,20,.55) 45%,rgba(0,24,15,.92))}
  .cat-hero .wrap{position:relative;width:100%}
  .cat-hero .crumb{color:#bfe0cb;padding-top:0}.cat-hero .crumb :last-child{color:#fff}
  .cat-hero h1{font:400 44px/1 var(--display);text-transform:uppercase}
  .cat-hero p{margin-top:6px;opacity:.9;font-size:14.5px;max-width:46ch}
  .subs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:16px 16px 4px}
  .subs::-webkit-scrollbar{display:none}
  .toolbar{position:sticky;top:59px;z-index:30;background:#fff;border-bottom:1px solid var(--linha)}
  .toolbar .wrap{display:flex;gap:10px;align-items:center;padding-top:10px;padding-bottom:10px}
  .toolbar .count{font-size:13.5px;color:var(--cinza);margin-right:auto}
  .toolbar select{height:40px;border-radius:999px;border:1.5px solid var(--linha);padding:0 14px;background:#fff;font-weight:600;font-size:14px}
  .toolbar .btn-filter{height:40px;padding:0 16px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--tinta);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
  .toolbar .btn-filter i{font-style:normal;background:var(--verde);color:#fff;border-radius:9px;min-width:18px;height:18px;font-size:11px;line-height:18px;text-align:center}
  .active-f{display:flex;flex-wrap:wrap;gap:6px}
  .active-f:empty{display:none}
  .active-f .chip{height:32px;font-size:13px}
  .layout{padding:18px 16px 50px}
  .side{display:none}
  .f-g{border-bottom:1px solid var(--linha);padding:16px 0}
  .f-g h4{font:700 13px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
  .f-sizes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .f-sizes button{height:40px;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--linha);font-weight:700;font-size:13px}
  .f-sizes button.on{background:var(--verde);color:#fff;box-shadow:none}
  .f-check{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14.5px;cursor:pointer}
  .f-check input{width:18px;height:18px;accent-color:var(--verde)}
  .sw{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--linha)}
  .more{display:grid;justify-items:center;gap:10px;margin-top:34px;font-size:13.5px;color:var(--cinza)}
  .more .bar{width:200px}
  .seo{padding:30px 16px 40px;border-top:1px solid var(--linha);color:var(--cinza);font-size:14px;max-width:820px}
  .seo h2{font:700 16px var(--ui);color:var(--tinta);margin-bottom:6px}
  .empty-f{grid-column:1/-1;text-align:center;padding:40px 0;color:var(--cinza)}
  @media(min-width:1024px){
    .cat-hero{min-height:340px;padding:60px 0 40px}.cat-hero h1{font-size:72px}
    .cat-hero::before{background:linear-gradient(90deg,rgba(0,24,15,.9) 20%,rgba(0,32,20,.5) 55%,rgba(0,32,20,.15))}
    .subs{max-width:var(--wrap);margin:0 auto;padding:20px 24px 0}
    .toolbar{position:static;border:0}
    .toolbar .btn-filter{display:none}
    .layout{display:grid;grid-template-columns:240px 1fr;gap:40px;max-width:var(--wrap);margin:0 auto;padding:10px 24px 70px}
    .side{display:block;align-self:start;position:sticky;top:130px}
    .side .f-g:first-child{padding-top:0}
    .seo{max-width:var(--wrap);margin:0 auto;padding:40px 24px 60px}
    .seo p{max-width:80ch}
  }
</style>
</head>
<body>

<section class="cat-hero" data-n="1">
  <div class="wrap">
    <nav class="crumb"><a href="index.html">Início</a><span>/</span><span id="crumbCat"></span></nav>
    <h1 id="catTitle"></h1>
    <p id="catSub"></p>
  </div>
</section>

<div class="subs" id="subs" data-n="2"></div>

<div class="toolbar" data-n="3">
  <div class="wrap">
    <span class="count" id="count"></span>
    <select id="sort" aria-label="Ordenar">
      <option value="rel">Mais vendidos</option>
      <option value="new">Lançamentos</option>
      <option value="asc">Menor preço</option>
      <option value="desc">Maior preço</option>
    </select>
    <button class="btn-filter" id="openFilters"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filtrar <i id="fCount" hidden></i></button>
  </div>
</div>

<div class="layout">
  <aside class="side" id="side" data-n="4"></aside>
  <main>
    <div class="active-f" id="activeF" style="margin-bottom:14px"></div>
    <div class="grid" id="grid" data-n="5"></div>
    <div class="more" data-n="6">
      <span id="moreTxt"></span><div class="bar"><i id="moreBar"></i></div>
      <button class="btn btn-ghost btn-sm" id="moreBtn">Ver mais</button>
    </div>
  </main>
</div>

<section class="seo" data-n="7">
  <h2 id="seoH"></h2>
  <p id="seoP"></p>
</section>

<div class="sheet" id="fSheet" hidden>
  <div class="sheet-bg" data-closef></div>
  <div class="sheet-card">
    <div class="sheet-h"><h3>Filtrar</h3><button class="ico" data-closef aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div id="fMobile"></div>
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-ghost" id="clearF" style="flex:1">Limpar</button><button class="btn" data-closef style="flex:2" id="applyF">Ver produtos</button></div>
  </div>
</div>

<script src="assets/dados.js"></script>
<script src="assets/site.js"></script>
<script>
const M = MANCHA;
const params = new URLSearchParams(location.search);
const c = params.get('c') || 'masculino';
M.init(c);

const sub = params.get('s') || '';
const INFO = {
  todas:['Todas as categorias','Tudo que a Mancha tem na loja, num lugar só.'],
  'linha-tradicional':['Linha Tradicional','O manto da arquibancada: Tradicional e Cordinha, do jeito que a bateria veste.'],
  masculino:['Masculino','Camisa, jaqueta, moletom e bermuda pro jogo, pra caravana e pro dia a dia.'],
  feminino:['Feminino','Regata, legging, short e bolsa. Elas também são Mancha.'],
  infantil:['Infantil','A molecada já nasce Mancha. Do bebê ao moleque da arquibancada.'],
  bones:['Bonés','Aba curva, dad hat e pescador. Tudo bordado com os símbolos da Mancha.'],
  acessorios:['Acessórios','Corrente, chaveiro, bag e o que mais combinar com o manto.'],
  calcados:['Calçados','Do estádio pra rua.'],
  souvenirs:['Souvenirs','Bandeirinha, porta-caneta e lembrança da Mancha pra casa e pro trampo.'],
};
const catObj = M.CATS.find(x=>x.id===c);
const subNome = sub && catObj?.sub ? (catObj.sub.find(([id])=>id===sub)||[])[1] : '';
const [titulo0, desc] = INFO[c] || [c, ''];
const titulo = subNome || titulo0;
document.title = titulo + ' · Loja Mancha Alvi Verde';
document.getElementById('catTitle').textContent = titulo;
document.getElementById('crumbCat').innerHTML = subNome ? `<a href="categoria.html?c=${c}">${titulo0}</a><span> / </span><span>${subNome}</span>` : titulo0;
// foto de fundo do topo: uma por categoria (subcategoria usa a da categoria-mãe)
const FOTO = {
  todas:'50% 70%', 'linha-tradicional':'50% 50%', masculino:'50% 35%', feminino:'60% 85%', infantil:'50% 25%',
  bones:'70% 15%', acessorios:'30% 45%', calcados:'50% 40%', souvenirs:'50% 55%',
};
const hero = document.querySelector('.cat-hero');
if (FOTO[c]) { hero.style.setProperty('--foto-cat', `url('assets/img/torcida/cat-${c}.jpg')`); hero.style.backgroundPosition = FOTO[c]; }
document.getElementById('catSub').textContent = subNome ? `${subNome} da Mancha. ${desc}` : desc;
document.getElementById('seoH').textContent = titulo + ' da Mancha Alvi Verde';
document.getElementById('seoP').innerHTML = `Na loja oficial da Mancha Alvi Verde tem ${titulo.toLowerCase()} com os símbolos da torcida, entrega pra todo o Brasil em até 2 dias úteis e 5% OFF no Pix. <span class="tbd">Texto de SEO de exemplo: um por categoria.</span>`;

// atalhos de subcategoria (árvore do site original)
const subsEl = document.getElementById('subs');
if(catObj?.sub) subsEl.innerHTML = `<a class="chip ${sub?'':'on'}" href="categoria.html?c=${c}">Tudo</a>` + catObj.sub.map(([id,n])=>`<a class="chip ${sub===id?'on':''}" href="categoria.html?c=${c}&s=${id}">${n}</a>`).join('');
else if(c==='todas') subsEl.innerHTML = M.CATS.map(x=>`<a class="chip" href="categoria.html?c=${x.id}">${x.nome}</a>`).join('');
else subsEl.remove();

let base = c==='todas' ? M.P.slice() : c==='linha-tradicional' ? M.P.filter(M.isTrad) : M.P.filter(p=>p.cats.includes(c)||p.cat===c);
if(sub) base = base.filter(p=>p.subs.includes(sub));
// tamanhos que existem nessa vitrine, na ordem certa
const TAM = M.sortTam([...new Set(base.flatMap(p=>p.tam.map(([t])=>t)))].filter(t=>t!=='Único'));
const roupa = TAM.length>1;
const state = {sizes:new Set(), price:new Set(), stock:true, color:new Set()};
const FAIXAS = [['Até R$ 50',0,50],['R$ 50 a R$ 100',50,100],['R$ 100 a R$ 200',100,200],['Acima de R$ 200',200,1e9]];
const corDe = p => /verde/i.test(p.nome)?'Verde':/branc/i.test(p.nome)?'Branco':/dourad/i.test(p.nome)?'Dourado':/prata/i.test(p.nome)?'Prata':'Branco';

function filtersHTML(){
  return `${roupa?`<div class="f-g"><h4>Tamanho</h4><div class="f-sizes">${TAM.map(t=>`<button data-size="${t}" class="${state.sizes.has(t)?'on':''}">${t}</button>`).join('')}</div></div>`:''}
  <div class="f-g"><h4>Preço</h4>${FAIXAS.map(([n],i)=>`<label class="f-check"><input type="checkbox" data-price="${i}" ${state.price.has(i)?'checked':''}>${n}</label>`).join('')}</div>
  <div class="f-g"><h4>Cor</h4>${[['Branco','#fff'],['Verde','#006837'],['Dourado','#c9a227'],['Prata','#c0c4c8']].map(([n,h])=>`<label class="f-check"><input type="checkbox" data-color="${n}" ${state.color.has(n)?'checked':''}><span class="sw" style="background:${h}"></span>${n}</label>`).join('')}</div>
  <div class="f-g"><label class="f-check"><input type="checkbox" data-stock ${state.stock?'checked':''}>Só com estoque</label></div>`;
}
let shown = 12;
function render(){
  let list = base.filter(p=>
    (!state.stock||!p.esgotado) &&
    (!state.sizes.size||p.tam.some(([t,ok])=>ok&&state.sizes.has(t))) &&
    (!state.price.size||[...state.price].some(i=>p.preco>=FAIXAS[i][1]&&p.preco<FAIXAS[i][2])) &&
    (!state.color.size||state.color.has(corDe(p))));
  const s = document.getElementById('sort').value;
  const rank = p => {const i=M.DESTAQUES.indexOf(p.slug);return i<0?99:i};
  list.sort((a,b)=> a.esgotado-b.esgotado || (s==='asc'?a.preco-b.preco: s==='desc'?b.preco-a.preco: s==='new'?0: rank(a)-rank(b)));
  const n = list.length;
  const ocultos = state.stock ? base.filter(p=>p.esgotado).length : 0;
  document.getElementById('count').innerHTML = n + ' produto' + (n===1?'':'s') + (ocultos?` · <button class="link" data-showout style="font-size:13px">ver +${ocultos} que acabaram</button>`:'');
  document.getElementById('grid').innerHTML = list.slice(0,shown).map(p=>M.card(p)).join('') || (base.length?'<p class="empty-f">Nada com esses filtros. Tira algum aí.</p>':`<div class="empty-f"><img src="assets/img/mascote.png" alt="" style="height:110px;margin:0 auto 12px"><p><b>Ainda não tem nada aqui.</b><br>Tá chegando. Enquanto isso, dá uma olhada na Linha Tradicional.</p><a class="btn" style="margin-top:14px" href="categoria.html?c=linha-tradicional">Ver a Linha Tradicional</a></div>`);
  const vis = Math.min(shown,n);
  document.getElementById('moreTxt').textContent = `Mostrando ${vis} de ${n}`;
  document.getElementById('moreBar').style.width = (n?vis/n*100:100)+'%';
  document.getElementById('moreBtn').hidden = vis>=n; document.querySelector('.more').hidden = !n;
  const tags = [...state.sizes].map(t=>['size',t,'Tam. '+t]).concat([...state.price].map(i=>['price',i,FAIXAS[i][0]]),[...state.color].map(x=>['color',x,x]));
  document.getElementById('activeF').innerHTML = tags.map(([k,v,l])=>`<button class="chip on" data-rmf="${k}:${v}">${l} ✕</button>`).join('');
  const fc = document.getElementById('fCount'); fc.hidden=!tags.length; fc.textContent=tags.length;
  document.getElementById('applyF').textContent = `Ver ${n} produto${n===1?'':'s'}`;
  document.getElementById('side').innerHTML = filtersHTML();
  if(!document.getElementById('fSheet').hidden) document.getElementById('fMobile').innerHTML = filtersHTML();
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-showout]')){state.stock=false;render();return}
  const sz=e.target.closest('[data-size]'); if(sz){const t=sz.dataset.size;state.sizes.has(t)?state.sizes.delete(t):state.sizes.add(t);render();return}
  const rm=e.target.closest('[data-rmf]'); if(rm){const [k,v]=rm.dataset.rmf.split(':');({size:state.sizes,price:state.price,color:state.color})[k].delete(k==='price'?+v:v);render();return}
  if(e.target.closest('[data-closef]')){document.getElementById('fSheet').hidden=true;document.body.style.overflow=''}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.price!==undefined){t.checked?state.price.add(+t.dataset.price):state.price.delete(+t.dataset.price)}
  else if(t.dataset.color){t.checked?state.color.add(t.dataset.color):state.color.delete(t.dataset.color)}
  else if(t.dataset.stock!==undefined){state.stock=t.checked}
  else if(t.id!=='sort') return;
  render();
});
document.getElementById('openFilters').onclick=()=>{const s=document.getElementById('fSheet');s.hidden=false;document.getElementById('fMobile').innerHTML=filtersHTML();document.body.style.overflow='hidden'};
document.getElementById('clearF').onclick=()=>{state.sizes.clear();state.price.clear();state.color.clear();state.stock=true;render()};
document.getElementById('moreBtn').onclick=()=>{shown+=12;render()};
render();
</script>
</body>
</html>
